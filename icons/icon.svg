<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="4" />

  <!-- Barbell Shaft -->
  <rect x="70" y="244" width="372" height="24" rx="6" fill="url(#barGrad)" />

  <!-- Inner Collar Sleeves -->
  <rect x="130" y="234" width="12" height="44" rx="3" fill="url(#goldGrad)" />
  <rect x="370" y="234" width="12" height="44" rx="3" fill="url(#goldGrad)" />

  <!-- Left Plates -->
  <!-- 25kg / Red Plate -->
  <rect x="150" y="116" width="32" height="280" rx="8" fill="#ef4444" stroke="#b91c1c" stroke-width="2" />
  <!-- 20kg / Blue Plate -->
  <rect x="188" y="146" width="30" height="220" rx="6" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2" />
  <!-- 15kg / Yellow Plate -->
  <rect x="224" y="176" width="28" height="160" rx="6" fill="#eab308" stroke="#a16207" stroke-width="2" />

  <!-- Right Plates -->
  <rect x="330" y="116" width="32" height="280" rx="8" fill="#ef4444" stroke="#b91c1c" stroke-width="2" />
  <rect x="294" y="146" width="30" height="220" rx="6" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2" />
  <rect x="260" y="176" width="28" height="160" rx="6" fill="#eab308" stroke="#a16207" stroke-width="2" />

  <!-- Center Energy Lightning / Power Crest -->
  <path d="M268 80 L220 250 L260 250 L236 430 L304 220 L260 220 Z" fill="url(#goldGrad)" filter="url(#glow)" />
</svg>

